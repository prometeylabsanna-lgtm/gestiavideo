services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gestia
      POSTGRES_USER: gestia
      POSTGRES_PASSWORD: gestia
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://gestia:gestia@db:5432/gestia
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata_dev:
