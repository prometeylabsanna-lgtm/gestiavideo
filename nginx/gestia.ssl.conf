upstream gestia_web {
    server web:8000;
}

# Shared rate limit for waitlist: 5 req/min per IP
limit_req_zone $binary_remote_addr zone=sub:10m rate=5r/m;

# ---------------------------------------------------------------------------
# HTTP → HTTPS (порт 80): лише ACME + 301
# CSP / HSTS / X-Frame-Options віддає Django — не дублювати.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name gestia-home.com www.gestia-home.com;
    server_tokens off;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS (порт 443)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name gestia-home.com www.gestia-home.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/gestia-home.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestia-home.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 128k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location /subscribe/ {
        limit_req zone=sub burst=5 nodelay;
        proxy_pass http://gestia_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://gestia_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
