upstream gestia_web {
    server web:8000;
}

# Shared rate limit for waitlist: 5 req/min per IP
limit_req_zone $binary_remote_addr zone=sub:10m rate=5r/m;

# ---------------------------------------------------------------------------
# HTTP (порт 80)
# До SSL: проксує на web + ACME.
# Після отримання сертифікатів — замініть location / і /subscribe/ на
# редірект 301 → https (див. закоментований блок «HTTP→HTTPS» нижче)
# і розкоментуйте server listen 443.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name gestia-home.com www.gestia-home.com;
    server_tokens off;

    client_max_body_size 128k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Frame-Options DENY always;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Після SSL увімкніть редірект (і вимкніть proxy-локації нижче) ---
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    location /subscribe/ {
        limit_req zone=sub burst=5 nodelay;
        proxy_pass http://gestia_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://gestia_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

